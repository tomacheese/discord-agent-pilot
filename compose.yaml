services:
  bot:
    build: .
    user: '1000:1000' # Match the UID that runs tmux/Claude Code on the host (change as needed)
    environment:
      CONFIG_PATH: /app/config.yaml
      DB_PATH: /data/registry.db
      DISCORD_TOKEN: ${DISCORD_TOKEN}
    volumes:
      - /proc:/host/proc:ro
      - /tmp/tmux-1000:/tmp/tmux-host # Host tmux socket directory (adjust to the UID). Do not use :ro, since connect() on a Unix domain socket requires write permission
      - ${HOME}/.claude:/host/claude-config:ro # claude.defaultConfigDir. One mount is needed per hostPath/containerPath pair in configDirs/defaultConfigDir. hostPath in config.yaml is not `~`-expanded, so use an absolute path there and expand it explicitly with ${HOME} here instead of `~`
      # - /home/user/.claude-work:/host/claude-config-work:ro # If configDirs in config.yaml allows an additional CLAUDE_CONFIG_DIR, mount its containerPath like this
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/data
    security_opt:
      - apparmor:unconfined # Required because the default docker-default profile blocks reading /proc
    restart: unless-stopped
