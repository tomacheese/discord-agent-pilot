guildId: '123456789012345678'
# If omitted, the DISCORD_TOKEN environment variable is used. If set, this takes precedence.
# discordToken: 'YOUR_BOT_TOKEN'
parentChannel:
  type: forum
  id: '234567890123456789'
allowedUserIds:
  - '345678901234567890'
workspaceRoots:
  - '/mnt/ssd/repos'
# Allowed CLAUDE_CONFIG_DIR values other than the default are listed here
# (`claude.defaultConfigDir` is always implicitly allowed).
# hostPath is string-compared with the value read from /proc/<pid>/environ, so `~` is not supported; use an absolute path.
# To allow more CLAUDE_CONFIG_DIR values, add entries to this array and add one
# matching bind mount per hostPath in compose.yaml.
configDirs:
  - hostPath: '/home/user/.claude-work'
    containerPath: '/host/claude-config-work'
tmux:
  pollIntervalMs: 3000
  socketDir: '/tmp/tmux-host'
sessionResolution:
  ambiguityThresholdMs: 3000
claude:
  defaultConfigDir:
    hostPath: '/home/user/.claude' # `~` is not supported; use an absolute path
    containerPath: '/host/claude-config'
  procRoot: '/host/proc' # compose.yaml mounts the host's /proc here, so this points at the host's /proc rather than the container's own
